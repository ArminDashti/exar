# Standalone API stack. Scripts under .armin/docker-scripts/ drive IMAGE_TAG / ports.
# On T3, Postgres is the existing exar-pgsql container on exar-net.
name: exar
services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: ${IMAGE_TAG:-exar-api:latest}
    container_name: ${API_CONTAINER_NAME:-exar}
    expose:
      - "${INTERNAL_PORT:-8080}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-exar}:${POSTGRES_PASSWORD:-exar}@exar-pgsql:5432/${POSTGRES_DB:-exar}?sslmode=disable
      ADDR: ":${INTERNAL_PORT:-8080}"
    networks:
      - exar-net
    restart: unless-stopped

networks:
  exar-net:
    name: ${DOCKER_NETWORK:-exar-net}
    external: true
