name = "exar"
main = "./worker.js"
compatibility_date = "2026-08-31"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run Worker first so we can fix Content-Type from a bad direct-upload MIME.
run_worker_first = true

[observability]
enabled = true
